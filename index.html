  <style>
    .value-number {
      font-weight: 700 !important;
    }
    .form-range {
      width: 100%;
    }
    .form-range::-webkit-slider-thumb {
      cursor: pointer;
    }
    .form-control {
      text-align: right;
    }
    #uploadProgress, #downloadProgress {
      height: 5px;
      transition: width 0.1s ease;
    }
    @media (max-width: 768px) {
      #title {
        font-size: 2.5rem;
      }
    }
    @media (prefers-color-scheme: dark) {
      body {
        background-color: #121212;
        color: #e1e1e1;
      }
      .bg-body-tertiary {
        background-color: #242424 !important;
      }
      .text-body-secondary {
        color: #adb5bd !important;
      }
      .form-control {
        background-color: #333;
        color: #e1e1e1;
        border-color: #444;
      }
      .form-control:focus {
        background-color: #333;
        color: #e1e1e1;
      }
      .border-top {
        border-color: #444 !important;
      }
      .text-muted {
        color: #adb5bd !important;
      }
    }

    /* Speedometer Card & Gauge Styling */
    .speedometer-card {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 420px;
      margin: 0.5rem auto 1rem auto;
      padding: 1.25rem 0.75rem 1rem 0.75rem;
      border-radius: 1.25rem;
      background: rgba(0, 0, 0, 0.02);
      border: 1px solid rgba(0, 0, 0, 0.08);
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.08);
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
    }

    .speedometer-svg {
      width: 100%;
      max-width: 360px;
      height: auto;
      overflow: visible;
      display: block;
      user-select: none;
    }

    .gauge-track {
      fill: none;
      stroke: rgba(0, 0, 0, 0.08);
      stroke-width: 10;
      stroke-linecap: round;
    }

    .gauge-active-arc {
      fill: none;
      stroke-width: 11;
      stroke-linecap: round;
      transition: stroke 0.3s ease;
    }

    .gauge-tick-major {
      stroke: rgba(0, 0, 0, 0.35);
      stroke-width: 2.5;
      stroke-linecap: round;
      transition: stroke 0.2s ease;
    }

    .gauge-tick-minor {
      stroke: rgba(0, 0, 0, 0.15);
      stroke-width: 1.2;
      stroke-linecap: round;
      transition: stroke 0.2s ease;
    }

    .gauge-tick-major.active {
      stroke: #0d6efd;
    }

    .gauge-tick-minor.active {
      stroke: rgba(13, 110, 253, 0.5);
    }

    .gauge-tick-label {
      fill: #64748b;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      font-size: 11px;
      font-weight: 600;
      user-select: none;
    }

    .gauge-speed-val {
      fill: #1e293b;
      font-family: system-ui, -apple-system, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
      font-size: 42px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: -1px;
    }

    .gauge-speed-unit {
      fill: #64748b;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .gauge-hub-outer {
      fill: #ffffff;
      stroke: rgba(0, 0, 0, 0.12);
      stroke-width: 2;
    }

    .gauge-hub-inner {
      fill: #e2e8f0;
    }

    .gauge-needle {
      will-change: transform;
    }

    /* Speedometer Status Badge */
    .speedometer-status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-top: 0.25rem;
      transition: all 0.3s ease;
    }

    .status-pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }

    .speedometer-status-badge.idle {
      background: rgba(108, 117, 125, 0.12);
      color: #6c757d;
    }
    .speedometer-status-badge.idle .status-pulse-dot {
      background: #6c757d;
    }

    .speedometer-status-badge.download {
      background: rgba(13, 110, 253, 0.12);
      color: #0d6efd;
    }
    .speedometer-status-badge.download .status-pulse-dot {
      background: #0d6efd;
      animation: pulseBlue 1.2s infinite ease-in-out;
    }

    .speedometer-status-badge.upload {
      background: rgba(25, 135, 84, 0.12);
      color: #198754;
    }
    .speedometer-status-badge.upload .status-pulse-dot {
      background: #198754;
      animation: pulseGreen 1.2s infinite ease-in-out;
    }

    .speedometer-status-badge.dual {
      background: rgba(32, 201, 151, 0.12);
      color: #20c997;
    }
    .speedometer-status-badge.dual .status-pulse-dot {
      background: #20c997;
      animation: pulseTeal 1.2s infinite ease-in-out;
    }

    .speedometer-status-badge.completed {
      background: rgba(13, 202, 240, 0.12);
      color: #0dcaf0;
    }
    .speedometer-status-badge.completed .status-pulse-dot {
      background: #0dcaf0;
    }

    @keyframes pulseBlue {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(13, 110, 253, 0.7); }
      70% { transform: scale(1.15); box-shadow: 0 0 0 6px rgba(13, 110, 253, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(13, 110, 253, 0); }
    }

    @keyframes pulseGreen {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(25, 135, 84, 0.7); }
      70% { transform: scale(1.15); box-shadow: 0 0 0 6px rgba(25, 135, 84, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(25, 135, 84, 0); }
    }

    @keyframes pulseTeal {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(32, 201, 151, 0.7); }
      70% { transform: scale(1.15); box-shadow: 0 0 0 6px rgba(32, 201, 151, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(32, 201, 151, 0); }
    }

    @media (prefers-color-scheme: dark) {
      .speedometer-card {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
      }
      .gauge-track {
        stroke: rgba(255, 255, 255, 0.08);
      }
      .gauge-tick-major {
        stroke: rgba(255, 255, 255, 0.35);
      }
      .gauge-tick-minor {
        stroke: rgba(255, 255, 255, 0.15);
      }
      .gauge-tick-major.active {
        stroke: #00f2fe;
      }
      .gauge-tick-minor.active {
        stroke: rgba(0, 242, 254, 0.5);
      }
      .gauge-tick-label {
        fill: #94a3b8;
      }
      .gauge-speed-val {
        fill: #ffffff;
      }
      .gauge-speed-unit {
        fill: #94a3b8;
      }
      .gauge-hub-outer {
        fill: #1e222d;
        stroke: rgba(255, 255, 255, 0.15);
      }
      .gauge-hub-inner {
        fill: #0f172a;
      }
      .speedometer-status-badge.idle {
        background: rgba(255, 255, 255, 0.08);
        color: #adb5bd;
      }
      .speedometer-status-badge.idle .status-pulse-dot {
        background: #adb5bd;
      }
    }
  </style>

<body>
  <div class="container py-2 py-md-4">
    <div class="p-3 p-md-5 mb-4 bg-body-tertiary rounded-3">
      <div class="container-fluid py-2 py-md-3">
        <h1 class="display-5 fw-bold" id="title">Data waster</h1>
        <p class="col-md-12 fs-4" id="desc">The fastest and most efficient way to waste your valuable mobile data.</p>
        <hr>

        <div class="row mb-3">
          <div class="col-md-6 mb-3 d-flex align-items-center">
            <div class="d-flex gap-2">
              <button type="button" class="btn btn-outline-primary active" id="downloadOption" data-active="true">
                <span id="downloadLabel">Download</span>
              </button>
              <button type="button" class="btn btn-outline-success" id="uploadOption" data-active="false">
                <span id="uploadLabel">Upload</span>
              </button>
            </div>
            <small class="text-muted ms-3" id="toggleHint">Select at least one direction</small>
          </div>
        </div>

        <div class="row mb-3">
          <div class="col-md-6 mb-2 mb-md-0">
            <label for="dataSize" class="form-label" id="sizeLabel">Data size (MB, 0 for infinite):</label>
            <input type="number" class="form-control" id="dataSize" value="10000" min="0" max="10000000">
          </div>
          <div class="col-md-6 mt-1 mt-md-0">
            <div class="d-flex align-items-center">
              <label for="threadCount" class="form-label me-2" id="threadLabel">Concurrent connections:</label>
              <span id="threadValue" class="fw-bold" style="position: relative; top: -4px;"></span>
            </div>
            <input type="range" class="form-range" id="threadCount" min="1" max="64" value="16" style="margin-top: 6px;">
          </div>
        </div>

        <div class="row">
          <div class="col-12 mb-3">
            <button class="btn btn-primary btn-lg w-100" type="button" id="startButton">Start</button>
          </div>
        </div>

        <div class="row mb-3">
          <div class="col-12 d-flex justify-content-center">
            <div id="speedometerContainer" class="w-100 d-flex justify-content-center"></div>
          </div>
        </div>

        <div class="row mb-2">
          <div class="col-12">
            <div class="progress-stacked" style="height: 8px;">
              <div class="progress h-100" role="progressbar" aria-label="Download progress" aria-valuemin="0" aria-valuemax="100" style="width: 0%">
                <div class="progress-bar bg-primary h-100" id="downloadProgress"></div>
              </div>
              <div class="progress h-100" role="progressbar" aria-label="Upload progress" aria-valuemin="0" aria-valuemax="100" style="width: 0%">
                <div class="progress-bar bg-success h-100" id="uploadProgress"></div>
              </div>
            </div>
          </div>
        </div>

        <div class="row mb-4">
          <div class="col-12 mb-2">
            <div class="d-flex justify-content-between align-items-center">
              <div>
                <span class="value-number" id="totalBytesProcessed">0</span>
                <span id="totalProgressLabel">MB total</span>
              </div>
              <div class="text-end">
                <span class="value-number" id="totalTransferSpeed">0</span>
                <span id="totalSpeedLabel">MB/sec</span>
              </div>
            </div>
          </div>
          <div class="col-md-6">
            <div class="d-flex align-items-center">
              <div class="me-2">
                <svg width="12" height="12"><rect width="12" height="12" style="fill:#0d6efd" /></svg>
              </div>
              <div>
                <span class="value-number" id="bytesDownloaded">0</span>
                <span id="downloadProgressLabel">MB downloaded</span>
              </div>
            </div>
          </div>
          <div class="col-md-6 text-md-end">
            <div class="d-flex align-items-center justify-content-md-end">
              <div class="me-2">
                <svg width="12" height="12"><rect width="12" height="12" style="fill:#198754" /></svg>
              </div>
              <div>
                <span class="value-number" id="bytesUploaded">0</span>
                <span id="uploadProgressLabel">MB uploaded</span>
              </div>
            </div>
          </div>
        </div>

        <div class="row">
          <div class="col-12">
            <p id="statusMessage" class="text-warning"></p>
          </div>
        </div>

        <footer class="pt-3 mt-4 text-body-secondary border-top">
          Created &amp; maintained by HLETRD
        </footer>
      </div>
    </div>
  </div>
</body>
